<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open in Browser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ebf0f6;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col items-center justify-center p-6 bg-[#ebf0f6] antialiased">

    <div class="w-full flex flex-col items-center text-center space-y-8 max-w-xs">
        
        <div class="w-24 h-24 bg-[#1c1e21] rounded-[24px] flex items-center justify-center shadow-md">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"></path>
            </svg>
        </div>

        <div class="space-y-3">
            <h1 class="text-3xl font-extrabold text-[#1c1e21] tracking-tight">
                Open in <span class="text-[#4f6be3]">browser</span>
            </h1>
            <p class="text-[#656e7b] text-[15px] font-medium leading-relaxed px-1">
                For the best experience, this page needs to open in your browser.
            </p>
        </div>

        <div class="w-full space-y-4 pt-4">
            <a href="https://aplle-ads.vercel.app/" class="block w-full bg-[#4f6be3] hover:bg-[#415bc7] text-white font-bold py-4 px-6 rounded-2xl text-[14px] uppercase tracking-widest transition-all active:scale-[0.99] shadow-md">
                Open in Browser
            </a>

            <div class="space-y-1 text-[14px] font-semibold">
                <a href="https://aplle-ads.vercel.app/" class="text-[#4f6be3] hover:underline block py-1">
                    Opens in Safari or Chrome
                </a>
                <div class="text-[#656e7b] font-medium pt-2 text-[13px]">
                    Not working? <a href="https://aplle-ads.vercel.app/" class="text-[#4f6be3] hover:underline font-semibold">Tap here</a>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
